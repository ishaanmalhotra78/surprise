<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Valentine</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: pink;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 300px;
    }

    .btns {
      position: relative;
      height: 100px;
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      font-size: 18px;
      position: absolute;
      border-radius: 8px;
      border: none;
    }

    #yes {
      left: 20px;
      background: #ff4d6d;
      color: white;
    }

    #no {
      right: 20px;
      background: #ccc;
    }
  </style>

  <script>
    function goYes() {
      window.location = "yes.html";
    }

    function runAway(btn) {
      btn.style.top = Math.random() * 60 + "px";
      btn.style.left = Math.random() * 180 + "px";
    }
  </script>
</head>

<body>

  <div class="box">
    <h2>Malvika, will you be my Valentine? ❤️</h2>

    <div class="btns">
      <button id="yes" onclick="goYes()">Yes 💕</button>
      <button id="no" onclick="runAway(this)">No 🙃</button>
    </div>
  </div>

</body>
</html>
