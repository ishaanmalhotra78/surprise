<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 15%, #ffd1dc, transparent 40%),
        radial-gradient(circle at 80% 25%, #ffc0cb, transparent 40%),
        radial-gradient(circle at 50% 90%, #ffb6c1, transparent 45%),
        linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -40px;
      font-size: 20px;
      opacity: 0.6;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 0.8;
      }
      to {
        transform: translateY(-120vh) scale(1.4);
        opacity: 0;
      }
    }

    .box {
      width: 100%;
      max-width: 420px;
      margin: 20px;
      padding: 36px 26px 40px;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 28px 28px 0 0;
      text-align: center;
      box-shadow: 0 -15px 50px rgba(255, 77, 109, 0.35);
      animation: slideUp 0.9s ease;
      z-index: 2;
    }

    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    h2 {
      font-size: 26px;
      line-height: 1.35;
      color: #ff2f6d;
      margin-bottom: 28px;
    }

    .btns {
      position: relative;
      height: 120px;
    }

    button {
      padding: 14px 26px;
      font-size: 18px;
      border-radius: 16px;
      border: none;
      position: absolute;
      cursor: pointer;
    }

    #yes {
      left: 20px;
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: white;
      box-shadow: 0 8px 22px rgba(255, 77, 109, 0.45);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    #no {
      right: 20px;
      background: #f2f2f2;
    }
  </style>

  <script>
    function goYes() {
      window.location.href = "yes.html";
    }

    function runAway(btn) {
      const maxX = 220;
      const maxY = 70;
      btn.style.left = Math.random() * maxX + "px";
      btn.style.top = Math.random() * maxY + "px";
    }

    // Create floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 6 + 6 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 12000);
    }

    setInterval(createHeart, 700);
  </script>
</head>

<body>

  <div class="box">
    <h2>Malvika, will you be my Valentine? ❤️</h2>

    <div class="btns">
      <button id="yes" onclick="goYes()">Yes 💕</button>
      <button id="no" onclick="runAway(this)">No 🙃</button>
    </div>
  </div>

</body>
</html>
