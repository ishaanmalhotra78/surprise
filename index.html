<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Valentine</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background:
      radial-gradient(circle at 20% 20%, #ffd1dc, transparent 40%),
      radial-gradient(circle at 80% 30%, #ffc0cb, transparent 40%),
      linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
  }

  .box {
    background: rgba(255, 255, 255, 0.95);
    padding: 35px 30px;
    border-radius: 22px;
    text-align: center;
    width: 320px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }

  h2 {
    color: #ff2f6d;
    font-size: 24px;
    line-height: 1.4;
  }

  .btns {
    position: relative;
    height: 110px;
    margin-top: 30px;
  }

  button {
    padding: 14px 22px;
    font-size: 18px;
    position: absolute;
    border-radius: 12px;
    border: none;
  }

  #yes {
    left: 20px;
    background: linear-gradient(135deg, #ff4d6d, #ff758f);
    color: white;
    box-shadow: 0 6px 15px rgba(255,77,109,0.4);
  }

  #no {
    right: 20px;
    background: #f0f0f0;
  }
</style>

  <script>
    function goYes() {
      window.location = "yes.html";
    }

    function runAway(btn) {
      btn.style.top = Math.random() * 60 + "px";
      btn.style.left = Math.random() * 180 + "px";
    }
  </script>
</head>

<body>

  <div class="box">
    <h2>Malvika, will you be my Valentine? ❤️</h2>

    <div class="btns">
      <button id="yes" onclick="goYes()">Yes 💕</button>
      <button id="no" onclick="runAway(this)">No 🙃</button>
    </div>
  </div>

</body>
</html>
